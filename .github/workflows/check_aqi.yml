name: Kiểm tra AQI định kỳ

# Chạy tự động mỗi 30 phút (cron dùng giờ UTC), kể cả khi máy cá nhân tắt.
# check_aqi.py tự xác định mốc 6h/12h/18h theo GIỜ VIỆT NAM (Asia/Ho_Chi_Minh)
# để gửi báo cáo định kỳ, nên không cần đổi lịch cron này theo múi giờ.
# Có thể chạy thủ công qua tab Actions > Run workflow (workflow_dispatch).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Cần quyền ghi để workflow có thể commit ngược file SQLite (db/aqi_history.db)
# chứa lịch sử AQI — vì GitHub Actions runner không giữ state giữa các lần chạy.
permissions:
  contents: write

jobs:
  check-aqi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện phụ thuộc
        run: pip install -r requirements.txt

      - name: Chạy script kiểm tra AQI
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AQI_CITY: ${{ vars.AQI_CITY }}
        run: python check_aqi.py

      - name: Commit lại lịch sử AQI (nếu có thay đổi)
        # if: always() -> chạy bước này kể cả khi bước "Chạy script kiểm tra
        # AQI" thất bại (vd. trạm đứng hình). Nếu không có dòng này, mỗi khi
        # script lỗi thì bộ đếm consecutive_failures (đã tăng trong DB local
        # của runner) sẽ bị huỷ theo runner mà không bao giờ commit về repo -
        # khiến lần chạy kế tiếp lại bắt đầu từ 0, làm cảnh báo "lỗi 3 lần
        # liên tiếp" không bao giờ kích hoạt được dù lỗi kéo dài nhiều giờ.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/aqi_history.db
          git diff --cached --quiet || git commit -m "chore: cập nhật lịch sử AQI [skip ci]"
          git push
